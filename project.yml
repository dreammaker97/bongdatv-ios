name: BongDaTV

options:
  bundleIdPrefix: com.bongdatv
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  BongDaTV:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: BongDaTV
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bongdatv.ios
        PRODUCT_NAME: BongDaTV
        INFOPLIST_FILE: BongDaTV/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"

  BongDaTVTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: BongDaTVTests
    dependencies:
      - target: BongDaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bongdatv.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BongDaTV.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BongDaTV"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"

schemes:
  BongDaTV:
    build:
      targets:
        BongDaTV: all
        BongDaTVTests: [test]
    test:
      targets:
        - BongDaTVTests
